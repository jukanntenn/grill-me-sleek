# grilling-sleek ansible configuration — run playbooks from the repo root:
#   ansible-playbook devops/ansible/deploy.yml                    # staging (fn), default
#   ansible-playbook devops/ansible/deploy.yml -e target=production
#
# Inventory and vault sources are declared here so no -i/--vault-password-file
# flags are needed. Secrets are per-variable !vault blocks in
# devops/ansible/group_vars/<env>/vault.yml; each environment's password lives
# in the avpm keyring under grilling-sleek-staging / grilling-sleek-prod
# (vault identities below). Add a secret with:
#   printf '%s' '<the-secret>' | ansible-vault encrypt_string \
#     --vault-id grilling-sleek-<env>@~/.local/bin/avpm-client \
#     --stdin-name <name> >> devops/ansible/group_vars/<env>/vault.yml

[defaults]
inventory = devops/ansible/hosts.yml
vault_identity_list = grilling-sleek-staging@~/.local/bin/avpm-client, grilling-sleek-prod@~/.local/bin/avpm-client
stdout_callback = default
callback_result_format = yaml
callback_result_indentation = 2
