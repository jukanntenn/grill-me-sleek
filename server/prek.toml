# server project — Rust hooks that must run with cwd=server/ (where
# Cargo.toml lives). Workspace mode strips the server/ prefix so cargo
# receives project-relative paths, enabling per-file formatting via
# `prek run --group format --files <path>` from the repo root.
#
# Not declared orphan: root builtins (trailing-whitespace, check-yaml, ...)
# and prettier-root still cover server files; server/.sqlx is exempt from
# fixers and validated here instead.

[[repos]]
repo = "local"

# ---- format group: mutating formatters (AI post-edit + commit) ----
[[repos.hooks]]
id = "cargo-fmt"
name = "cargo fmt (server)"
language = "system"
entry = "cargo fmt"
files = '\.rs$'
pass_filenames = false
groups = ["format"]
stages = ["pre-commit"]

# ---- lint group: read-only gate (AI Stop + commit + CI) ----
# --locked also fails when Cargo.lock is out of sync with Cargo.toml, so the
# lockfile freshness is gated here rather than by a separate hook.
[[repos.hooks]]
id = "cargo-clippy"
name = "cargo clippy --locked (server)"
language = "system"
entry = "cargo clippy --all-targets --locked -- -D warnings"
files = '\.rs$|^Cargo\.toml$|^Cargo\.lock$'
pass_filenames = false
groups = ["lint"]
stages = ["pre-commit"]

# Generated-files drift gate: the .sqlx/ offline cache must match the query!
# macros and migrations. Fails if stale; fix with
# `python3 scripts/migrate.py prepare` (migrate.py is cwd-independent).
[[repos.hooks]]
id = "sqlx-check"
name = "sqlx cache up to date (server)"
language = "system"
entry = "python3 ../scripts/migrate.py check"
files = '\.rs$|^migrations/|^Cargo\.toml$|^\.sqlx/'
pass_filenames = false
groups = ["check"]
stages = ["pre-commit"]

# ---- pre-push: tests (mirrors the CI server job) ----
[[repos.hooks]]
id = "server-test"
name = "cargo test (server, pre-push)"
language = "system"
entry = "cargo test"
files = '\.rs$|^migrations/|^Cargo\.toml$|^Cargo\.lock$|^\.sqlx/'
pass_filenames = false
stages = ["pre-push"]
