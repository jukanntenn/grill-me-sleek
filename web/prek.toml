# web project — JS/TS hooks that must run with cwd=web/ (where package.json
# lives) and resolve local node_modules binaries via pnpm. Workspace mode
# strips the web/ prefix for per-file formatting.

[[repos]]
repo = "local"

# ---- format group: per-file formatter (AI post-edit + commit) ----
# Covers everything under web/ (src/, index.html, configs), using
# web/.prettierrc.json (adds the tailwindcss plugin).
[[repos.hooks]]
id = "prettier"
name = "prettier (web)"
language = "system"
entry = "pnpm exec prettier --write"
files = '\.(ts|tsx|js|jsx|mjs|cjs|json|css|md|html)$'
pass_filenames = true
groups = ["format"]
stages = ["pre-commit"]

# ---- lint group: read-only gates (AI Stop + commit + CI) ----
[[repos.hooks]]
id = "eslint"
name = "eslint (web)"
language = "system"
entry = "pnpm lint"
files = '\.(ts|tsx|js|jsx)$'
pass_filenames = false
groups = ["lint"]
stages = ["pre-commit"]

[[repos.hooks]]
id = "typecheck"
name = "tsc --noEmit (web)"
language = "system"
entry = "pnpm exec tsc --noEmit"
files = '\.(ts|tsx)$'
pass_filenames = false
groups = ["lint"]
stages = ["pre-commit"]

# Lockfile freshness gate: --frozen-lockfile fails when pnpm-lock.yaml is
# out of sync with package.json.
[[repos.hooks]]
id = "lockfile-fresh"
name = "pnpm install --frozen-lockfile (web)"
language = "system"
entry = "pnpm install --frozen-lockfile --prefer-offline"
files = '^(package\.json|pnpm-lock\.yaml)$'
pass_filenames = false
groups = ["check"]
stages = ["pre-commit"]

# ---- pre-push: tests + build (mirrors the CI web job) ----
[[repos.hooks]]
id = "web-test"
name = "vitest (web, pre-push)"
language = "system"
entry = "pnpm test"
files = '\.(ts|tsx|js|jsx|mjs|cjs|json|css|md|html)$|^vite\.config\.ts$'
pass_filenames = false
stages = ["pre-push"]

[[repos.hooks]]
id = "web-build"
name = "tsc && vite build (web, pre-push)"
language = "system"
entry = "pnpm build"
files = '\.(ts|tsx|js|jsx|mjs|cjs|json|css|md|html)$|^vite\.config\.ts$'
pass_filenames = false
stages = ["pre-push"]
