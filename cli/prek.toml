# cli project — JS/TS hooks that must run with cwd=cli/ (where package.json
# lives) and resolve local node_modules binaries via pnpm. Workspace mode
# strips the cli/ prefix for per-file formatting.

[[repos]]
repo = "local"

# ---- format group: per-file formatter (AI post-edit + commit) ----
[[repos.hooks]]
id = "prettier"
name = "prettier (cli)"
language = "system"
entry = "pnpm exec prettier --write"
files = '\.(ts|tsx|js|jsx|mjs|cjs|json|md)$'
pass_filenames = true
groups = ["format"]
stages = ["pre-commit"]

# ---- lint group: read-only gates (AI Stop + commit + CI) ----
[[repos.hooks]]
id = "eslint"
name = "eslint (cli)"
language = "system"
entry = "pnpm lint"
files = '\.(ts|tsx|js|jsx)$'
pass_filenames = false
groups = ["lint"]
stages = ["pre-commit"]

[[repos.hooks]]
id = "typecheck"
name = "tsc --noEmit (cli)"
language = "system"
entry = "pnpm exec tsc --noEmit"
files = '\.(ts|tsx)$'
pass_filenames = false
groups = ["lint"]
stages = ["pre-commit"]

# Lockfile freshness gate: --frozen-lockfile fails when pnpm-lock.yaml is
# out of sync with package.json.
[[repos.hooks]]
id = "lockfile-fresh"
name = "pnpm install --frozen-lockfile (cli)"
language = "system"
entry = "pnpm install --frozen-lockfile --prefer-offline"
files = '^(package\.json|pnpm-lock\.yaml)$'
pass_filenames = false
groups = ["check"]
stages = ["pre-commit"]

# ---- pre-push: tests + build (mirrors the CI cli job) ----
# build:prod is the artifact that ships to npm (esbuild bundle); type safety
# is already gated at commit time by the typecheck hook.
[[repos.hooks]]
id = "cli-test-and-build"
name = "vitest + esbuild prod (cli, pre-push)"
language = "system"
entry = "pnpm test && pnpm build:prod"
files = '\.(ts|tsx|js|jsx|mjs|cjs|json|md)$|^package\.json$|^esbuild\.config\.mjs$'
pass_filenames = false
stages = ["pre-push"]
