# =============================================================================
# 发布 Docker 镜像到 Docker Hub（多架构）
#
# Tag 规范（git tag -> Docker Hub tag on jukanntenn/grilling-sleek）：
#   v0.1.3      -> 0.1.3 + latest   （正式版）
#   v0.1.3-rc.1 -> 0.1.3-rc.1       （预发布：只有版本 tag，latest 不动）
# 「正式版」由精确匹配 ^v\d+\.\d+\.\d+$ 判定 —— 与 release.yml 的
# prerelease 判定同一条规则。
# 滚动 main tag 不在这里发布：它只存在于内网私有 registry（本机
# docker/build.py --push），GitHub Actions 到不了内网。
#
# 多架构原生构建（无 QEMU）：amd64 在 ubuntu-latest，arm64 在 GitHub arm
# runner。每个架构推 per-arch tag，manifest job 合并成最终的多架构列表。
# 本地多平台构建只能走 buildx（QEMU），见 docker/build.py。
# =============================================================================

name: Publish Docker image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Docker tag to publish (e.g. 0.2.0-rc.2); empty = use the pushed tag"
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_single_arch:
    name: Build & push (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Resolve tags
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            TAG="v${{ inputs.version }}"
          else
            TAG=${GITHUB_REF#refs/tags/}
          fi
          # Docker tags strip the leading "v": v0.1.3 -> 0.1.3,
          # v0.1.3-rc.1 -> 0.1.3-rc.1 (semver, hyphenated prerelease).
          DOCKER_TAG=${TAG#v}
          # A release is stable iff the git tag is exactly vX.Y.Z. Anything
          # else (any suffix: -rc.N, -beta, ...) is a prerelease: version tag
          # only, `latest` never moves. Same rule as release.yml.
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            STABLE=true
          else
            STABLE=false
          fi
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "DOCKER_TAG=$DOCKER_TAG" >> $GITHUB_ENV
          echo "STABLE=$STABLE" >> $GITHUB_ENV
          echo "git tag: $TAG -> docker tag: $DOCKER_TAG (stable: $STABLE)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: jukanntenn/grilling-sleek

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            jukanntenn/grilling-sleek:${{ env.DOCKER_TAG }}-${{ matrix.arch }}
            ${{ env.STABLE == 'true' && format('jukanntenn/grilling-sleek:latest-{0}', matrix.arch) || '' }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

  create_manifests:
    name: Create multi-arch manifests
    needs: [build_single_arch]
    runs-on: ubuntu-latest
    steps:
      - name: Extract tag
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            TAG="v${{ inputs.version }}"
          else
            TAG=${GITHUB_REF#refs/tags/}
          fi
          DOCKER_TAG=${TAG#v}
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            STABLE=true
          else
            STABLE=false
          fi
          echo "DOCKER_TAG=$DOCKER_TAG" >> $GITHUB_ENV
          echo "STABLE=$STABLE" >> $GITHUB_ENV

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create & push manifest (version tag)
        run: |
          docker buildx imagetools create \
            -t jukanntenn/grilling-sleek:${DOCKER_TAG} \
            jukanntenn/grilling-sleek:${DOCKER_TAG}-amd64 \
            jukanntenn/grilling-sleek:${DOCKER_TAG}-arm64

      - name: Create & push manifest (latest)
        if: ${{ env.STABLE == 'true' }}
        run: |
          docker buildx imagetools create \
            -t jukanntenn/grilling-sleek:latest \
            jukanntenn/grilling-sleek:latest-amd64 \
            jukanntenn/grilling-sleek:latest-arm64
