# =============================================================================
# CI: prek 质量门控 + 单元测试 + 构建
#
# 单一真相源：所有 format/lint/check 都在 prek 中声明（prek.toml +
# server/prek.toml + web/prek.toml + cli/prek.toml + dsh/prek.toml）。gate
# job 只负责装好 prek hooks 需要的工具链，然后运行 `prek run --all-files`。
# CI 中不存在第二套 lint/format 定义 —— 本地（git commit / AI hooks /
# pre-push）与 CI 跑的是同一批 hooks，不会 drift。
#
# gate 无路径过滤（简单优先于 CI 分钟数：纯 web 改动也会装 Rust 工具链）；
# test/build job 仍按路径过滤（dorny/paths-filter），纯文档改动零成本。
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Job 0: prek 质量门控（format + lint + check，全量文件）
  # 等价于本地 `prek run --all-files`；formatter 在 CI 中会改文件，
  # exit 1 即视为失败（等效 check 模式）。
  # ---------------------------------------------------------------------------
  gate:
    name: prek gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "server -> target"

      - name: Install sqlx-cli (with sqlite)
        run: cargo install sqlx-cli --no-default-features --features sqlite --locked

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.25.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: |
            web/pnpm-lock.yaml
            cli/pnpm-lock.yaml
            dsh/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir cli install --frozen-lockfile
          pnpm --dir dsh install --frozen-lockfile

      # prek 的 actionlint hook 本地未安装时优雅跳过，CI 负责强制执行。
      - name: Install actionlint
        run: |
          curl -sSL "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz" | tar xz -C /tmp
          sudo mv /tmp/actionlint /usr/local/bin/
          actionlint --version

      - name: Setup uv (prek via uvx)
        uses: astral-sh/setup-uv@v10.0.1

      - name: Validate prek config
        run: uvx prek validate-config prek.toml server/prek.toml web/prek.toml cli/prek.toml dsh/prek.toml

      - name: prek run --all-files
        run: uvx prek run --all-files

  # ---------------------------------------------------------------------------
  # Job 1: 路径过滤 — 总是运行，输出哪些子系统有变更
  # ---------------------------------------------------------------------------
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    needs: gate
    outputs:
      server: ${{ steps.filter.outputs.server }}
      web: ${{ steps.filter.outputs.web }}
      cli: ${{ steps.filter.outputs.cli }}
      dsh: ${{ steps.filter.outputs.dsh }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Path filter
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            server:
              - 'server/**'
              - 'Cargo.lock'
            web:
              - 'web/**'
            cli:
              - 'cli/**'
            dsh:
              - 'dsh/**'
            docker:
              - 'docker/**'
              - '.dockerignore'

  # ---------------------------------------------------------------------------
  # Job 2: Rust 服务器测试 + 构建（lint/format 由 gate 覆盖）
  # ---------------------------------------------------------------------------
  server:
    name: Server
    needs: changes
    if: ${{ needs.changes.outputs.server == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "server -> target"

      - name: Tests
        run: cd server && cargo test

      - name: Build
        run: cd server && cargo build --release

  # ---------------------------------------------------------------------------
  # Job 3: Web 前端测试 + 构建（lint/format 由 gate 覆盖）
  # ---------------------------------------------------------------------------
  web:
    name: Web
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.25.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: "web/pnpm-lock.yaml"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

  # ---------------------------------------------------------------------------
  # Job 4: CLI 构建 + 冒烟测试（lint/format 由 gate 覆盖）
  # ---------------------------------------------------------------------------
  cli:
    name: CLI
    needs: changes
    if: ${{ needs.changes.outputs.cli == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.25.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: "cli/pnpm-lock.yaml"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (development)
        run: pnpm build

      - name: Build (production)
        run: NODE_ENV=production pnpm build:prod

      - name: Smoke test
        run: node dist/grilling-sleek.js --help

  # ---------------------------------------------------------------------------
  # Job 5: dsh 插件测试 + 构建 + tarball 形状（lint/format 由 gate 覆盖）
  # 与 dsh-release.yml 的发版门禁同一套命令；pack 顺带证明 bundle patch
  # 与 README/LICENSE 随 tarball 而行。
  # ---------------------------------------------------------------------------
  dsh:
    name: DSH plugin
    needs: changes
    if: needs.changes.outputs.dsh == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.25.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: dsh/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Tests
        run: pnpm test

      - name: Build (production)
        run: pnpm build:prod

      - name: Pack (bundle manifest rides the tarball)
        run: pnpm pack --dry-run | grep -E 'cordis\.patch\.yml|README\.zh\.md|LICENSE'

  # ---------------------------------------------------------------------------
  # Job 6: Docker 构建检查
  # ---------------------------------------------------------------------------
  docker:
    name: Docker
    needs: changes
    if: ${{ needs.changes.outputs.docker == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: grilling-sleek:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
