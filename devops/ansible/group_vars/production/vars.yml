---
# production (ttyo @ 43.133.160.29) — Cloudflare 之后的源站。
# Caddy 用 Cloudflare Origin CA 证书在 8443 上服务 HTTPS；访客侧 TLS 由
# Cloudflare 边缘终结（Full Strict），且仅接受 Cloudflare CIDR 的回源连接。

env: production

# Pin 版本而非 `latest`：docker-publish.yml 对预发布 tag 刻意不移动
# `latest`（latest 恒指向最新正式版），且 pin 让部署可复现。
# 格式为 Docker Hub tag（git tag 去掉前导 "v"）：
#   v0.2.1 -> 0.2.1, v0.2.1-rc.1 -> 0.2.1-rc.1
# 在 staging 验证通过后晋升时更新。单次覆盖：
#   ansible-playbook devops/ansible/deploy.yml -e target=production -e image_tag=0.2.1
image_tag: "0.2.0-rc.2"
image: "jukanntenn/grilling-sleek:{{ image_tag }}"

# /v1/healthz 必须上报的版本（server Cargo.toml 版本，与镜像 tag 一致；
# check_deploy.py 会归一化前导 "v"）。不匹配则部署判失败。
expected_version: "0.2.0-rc.2"

host_port: 8443
public_url: "https://grillingsleek.online"

tls_profile: origin
caddyfile_template: Caddyfile.production.j2

rust_log: "info"

# Cloudflare CIDR：源站只接受来自这些网段的回源连接（Caddy @not_cf 403），
# 并信任它们转发 X-Forwarded-For。
# 变更时从 https://www.cloudflare.com/ips/ 同步（IPv4 + IPv6，空格分隔）。
cloudflare_cidrs: "173.245.48.0/20 103.21.244.0/22 103.22.200.0/22 103.31.4.0/22 141.101.64.0/18 108.162.192.0/18 190.93.240.0/20 188.114.96.0/20 197.234.240.0/22 198.41.128.0/17 162.158.0.0/15 104.16.0.0/13 104.24.0.0/14 172.64.0.0/13 131.0.72.0/22 2400:cb00::/32 2606:4700::/32 2803:f800::/32 2405:b500::/32 2405:8100::/32 2a06:98c0::/29 2c0f:f248::/32"

app_dirs:
  - "{{ app_path }}"
  - "{{ app_path }}/certs"
  - "{{ app_path }}/data"
  - "{{ app_path }}/log"
