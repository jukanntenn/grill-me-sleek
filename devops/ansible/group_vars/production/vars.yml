---
# production (ttyo @ 43.133.160.29) — the origin behind Cloudflare.
# The edge connects to host port 443, terminated by the host's systemd Caddy
# (the shared gateway markpost set up; TLS = Origin CA cert). grilling-sleek
# joins as a conf.d site block proxying to the container, which serves plain
# HTTP published loopback-only. 443 is the only proxied HTTPS port with edge
# caching enabled — every other one is cache-disabled and re-enabling is
# Enterprise-only (the direct-8443 era never got edge cache).

env: production

# Pin 版本而非 `latest`：docker-publish.yml 对预发布 tag 刻意不移动
# `latest`（latest 恒指向最新正式版），且 pin 让部署可复现。
# 格式为 Docker Hub tag（git tag 去掉前导 "v"）：
#   v0.2.1 -> 0.2.1, v0.2.1-rc.1 -> 0.2.1-rc.1
# 在 staging 验证通过后晋升时更新。单次覆盖：
#   ansible-playbook devops/ansible/deploy.yml -e target=production -e image_tag=0.2.1
image_tag: "v0.2.0-rc.2"
image: "jukanntenn/grilling-sleek:{{ image_tag }}"

# /v1/healthz 必须上报的版本（server Cargo.toml 版本，与镜像 tag 一致；
# check_deploy.py 会归一化前导 "v"）。不匹配则部署判失败。
expected_version: "0.2.0-rc.2"

# Loopback-only consumer port of the host Caddy gateway (markpost's own
# site block holds 8080; grilling-sleek takes the next one).
host_port: 8081
public_url: "https://grillingsleek.online"

caddyfile_template: Caddyfile.production.j2

rust_log: "info"

# Host Caddy gateway (shared across services on the VPS; config imports
# /etc/caddy/conf.d/*.caddy). The playbook copies the Origin CA cert from
# {{ app_path }}/certs/ and templates one site block; reload fires on change
# only. Other services join the same gateway with their own site blocks.
gateway_host: grillingsleek.online
gateway_site_file: /etc/caddy/conf.d/grilling-sleek.caddy
gateway_certs_dir: /etc/caddy/certs/grilling-sleek

# Cloudflare CIDR ranges for the host firewall allowlist on 443. No template
# consumes this list anymore — client-IP trust moved to the loopback hop
# between gateway and container (see Caddyfile.production.j2). Sync from
# https://www.cloudflare.com/ips/ (IPv4 + IPv6, space-separated) and refresh
# the VPS firewall — the sole enforcement point.
cloudflare_cidrs: "173.245.48.0/20 103.21.244.0/22 103.22.200.0/22 103.31.4.0/22 141.101.64.0/18 108.162.192.0/18 190.93.240.0/20 188.114.96.0/20 197.234.240.0/22 198.41.128.0/17 162.158.0.0/15 104.16.0.0/13 104.24.0.0/14 172.64.0.0/13 131.0.72.0/22 2400:cb00::/32 2606:4700::/32 2803:f800::/32 2405:b500::/32 2405:8100::/32 2a06:98c0::/29 2c0f:f248::/32"

app_dirs:
  - "{{ app_path }}"
  - "{{ app_path }}/certs"
  - "{{ app_path }}/data"
  - "{{ app_path }}/log"
