# @grilling-sleek/dsh-tool-grill-user bundle patch
#
# The `dsh.bundle.patch` layer of the published npm package. Installing via
# the official CLI —
#
#   dsh plugin --profile web add @grilling-sleek/dsh-tool-grill-user
#
# — reconciles `dsh.profile.bundles`, sees the `dsh.bundle` declaration in
# package.json, and appends this package to the profile's bundle stack;
# profile boot then merges this single insert: the same row the local dev
# overlay mounts (`id: tool-grill-user`), referenced by package name instead
# of source path.
#
# Set config through any later layer — the profile's own cordis.patch.yml
# or a `--patch` overlay re-inserting this row with a `config:` block; later
# layers win per row. With no config the plugin races every round on the
# public Hub at 'https://grillingsleek.online'; point baseUrl at a
# self-hosted Hub, or set it to '' for hubless (cards-only) rounds:
#
#   - insert:
#       - id: tool-grill-user
#         name: '@grilling-sleek/dsh-tool-grill-user'
#         config:
#           baseUrl: 'https://your-hub.example.com'
- insert:
    - id: tool-grill-user
      name: "@grilling-sleek/dsh-tool-grill-user"
