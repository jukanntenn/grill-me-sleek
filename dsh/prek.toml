# dsh project — JS/TS hooks that must run with cwd=dsh/ (where package.json
# lives) and resolve local node_modules binaries via pnpm. Workspace mode
# strips the dsh/ prefix for per-file formatting.

[[repos]]
repo = "local"

# ---- format group: per-file formatter (AI post-edit + commit) ----
[[repos.hooks]]
id = "prettier"
name = "prettier (dsh)"
language = "system"
entry = "pnpm exec prettier --write"
files = '\.(ts|tsx|js|jsx|mjs|cjs|json|md)$'
pass_filenames = true
groups = ["format"]
stages = ["pre-commit"]

# ---- lint group: read-only gates (AI Stop + commit + CI) ----
[[repos.hooks]]
id = "eslint"
name = "eslint (dsh)"
language = "system"
entry = "pnpm lint"
files = '\.(ts|tsx|js|jsx|mjs)$'
pass_filenames = false
groups = ["lint"]
stages = ["pre-commit"]

[[repos.hooks]]
id = "typecheck"
name = "tsc --noEmit (dsh)"
language = "system"
entry = "pnpm exec tsc --noEmit"
files = '\.(ts|tsx)$'
pass_filenames = false
groups = ["lint"]
stages = ["pre-commit"]

# Lockfile freshness gate: --frozen-lockfile fails when pnpm-lock.yaml is
# out of sync with package.json.
[[repos.hooks]]
id = "lockfile-fresh"
name = "pnpm install --frozen-lockfile (dsh)"
language = "system"
entry = "pnpm install --frozen-lockfile --prefer-offline"
files = '^(package\.json|pnpm-lock\.yaml)$'
pass_filenames = false
groups = ["check"]
stages = ["pre-commit"]

# ---- pre-push: tests + build (mirrors CI) ----
[[repos.hooks]]
id = "dsh-test"
name = "vitest (dsh, pre-push)"
language = "system"
entry = "pnpm test"
files = '\.(ts|tsx|js|jsx|mjs|cjs|json|md)$|^package\.json$|^esbuild\.config\.mjs$'
pass_filenames = false
stages = ["pre-push"]

[[repos.hooks]]
id = "dsh-build"
name = "esbuild prod (dsh, pre-push)"
language = "system"
entry = "pnpm build:prod"
files = '\.(ts|tsx|js|jsx|mjs|cjs|json|md)$|^package\.json$|^esbuild\.config\.mjs$'
pass_filenames = false
stages = ["pre-push"]
