# prek configuration — workspace root. See:
#   - server/prek.toml  (Rust hooks, cwd=server)
#   - web/prek.toml     (JS/TS hooks, cwd=web)
#   - cli/prek.toml     (JS/TS hooks, cwd=cli)
#   - dsh/prek.toml     (JS/TS hooks, cwd=dsh)
#
# Single source of truth for the whole pipeline: AI post-edit hooks run
# `prek run --group format --files <edited>`, AI Stop runs `prek run --group
# lint --all-files`, git commit runs everything, CI runs `prek run
# --all-files`. No parallel formatter/lint definition exists outside prek.
#
# Groups:
#   format — mutating fixers (auto-fix by default)
#   lint   — read-only quality gates (AI Stop + commit + CI)
#   check  — read-only validation: generated files, lockfiles, static checks
#
# Install: prek install

default_install_hook_types = ["pre-commit", "pre-push", "commit-msg"]

# Mutating/fixer builtins share one generated-file exemption (the generator
# owns those bytes; a fixer diverging from raw output would trip the
# freshness gates in server/web/cli). The regex is inlined per hook because
# prek does not support config-level variable interpolation.
#
# Generated files exempt from fixers:
#   - server/.sqlx/     sqlx offline cache (validated by server:sqlx-check)
#   - */pnpm-lock.yaml  lockfiles (validated by the *:lockfile-fresh gates)

# ---- check group: read-only builtin checks (commit + CI; whole tree) ----
[[repos]]
repo = "builtin"
hooks = [
  { id = "check-yaml", groups = ["check"] },
  { id = "check-toml", groups = ["check"] },
  { id = "check-json", exclude = '^\.vscode/', groups = ["check"] },
  { id = "check-merge-conflict", groups = ["check"] },
  { id = "check-added-large-files", groups = ["check"] },
  { id = "detect-private-key", groups = ["check"] },
  # Ensures the hook scripts in .claude/hooks, .codex/hooks, .zcode/hooks are
  # executable.
  { id = "check-shebang-scripts-are-executable", groups = ["check"] },
]

# ---- format group: mutating builtin fixers (AI post-edit + commit) ----
[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace", exclude = '^server/\.sqlx/|pnpm-lock\.yaml$', groups = ["format"] },
  { id = "mixed-line-ending", args = ["--fix=lf"], exclude = '^server/\.sqlx/|pnpm-lock\.yaml$', groups = ["format"] },
  { id = "end-of-file-fixer", exclude = '^server/\.sqlx/|pnpm-lock\.yaml$', groups = ["format"] },
]

[[repos]]
repo = "local"

# AI tool configs in sync (AGENTS.md == CLAUDE.md per pair, direction-free;
# mirrored skills derived from .claude/skills/; the packaged grilling-sleek
# skill is deliberately not checked).
[[repos.hooks]]
id = "agents-sync"
name = "AI tool configs in sync"
language = "system"
entry = "python3 scripts/check_agents.py"
files = '(^|/)(AGENTS|CLAUDE)\.md$|^\.claude/skills/|^\.agents/skills/|^\.zcode/skills/'
pass_filenames = false
stages = ["pre-commit"]
groups = ["check"]

# Documentation gates (links, current-state prose, GS-RFC format, budgets,
# bilingual pairs, specs index) over the full Markdown corpus — see
# specs/AGENTS.md. pass_filenames = false: the pair and index gates need the
# whole corpus in one run (the hook runner may batch filenames), and prek
# stashes unstaged changes during hook runs, so a full scan sees exactly the
# state being committed. CI runs the same gates via `prek run --all-files`.
[[repos.hooks]]
id = "doc-check"
name = "documentation gates"
language = "system"
entry = "python3 scripts/doc_sync.py"
files = '\.md$|^scripts/(doclib|doc_sync|verify_|agentlib|doc_budgets|doc_languages)'
pass_filenames = false
stages = ["pre-commit"]
groups = ["check"]

# Unified version train consistency: every version carrier in the tree
# must agree (member set: scripts/versionlib.py, shared with the mutating
# scripts/sync-version.py). Fires when any member — or the gate itself —
# is staged; pass_filenames = false for the same reason as doc-check:
# prek stashes unstaged changes, so one full-train scan sees exactly the
# state being committed. CI runs it via `prek run --all-files`; the
# publish workflows additionally run it with --expect <tag> before any
# artifact goes out.
[[repos.hooks]]
id = "version-sync"
name = "version train consistency"
language = "system"
entry = "python3 scripts/verify_versions.py"
files = '^package\.json$|^(cli|web|e2e)/package\.json$|^server/Cargo\.toml$|^\.claude-plugin/(plugin|marketplace)\.json$|^README(\.zh)?\.md$|^scripts/(versionlib|verify_versions|sync-version)\.py$'
pass_filenames = false
stages = ["pre-commit"]
groups = ["check"]

# ---- format group: root-level formatter (non-app, non-agent dirs) ----
# Uses web's prettier install (no root node_modules); web/, cli/ and dsh/ are
# excluded because they have their own per-file prettier hooks with their own
# configs. .vscode is JSONC; agent dirs, skills/ (packaged-skill source —
# must stay byte-identical with the packaged copies) and .sqlx are exempt.
[[repos.hooks]]
id = "prettier-root"
name = "prettier (root, non-app dirs)"
language = "system"
entry = "web/node_modules/.bin/prettier --write"
files = '\.(md|ya?ml|json|html|css)$'
exclude = '^(\.agents|\.claude|\.codex|\.opencode|\.zcode|\.vscode)/|^skills/|^(web|cli|dsh)/|^server/\.sqlx/|pnpm-lock\.yaml$'
pass_filenames = true
groups = ["format"]
stages = ["pre-commit"]

# GitHub Actions workflow linting. Skipped gracefully when actionlint is not
# installed locally; CI installs it and enforces the gate.
[[repos.hooks]]
id = "actionlint"
name = "actionlint (GitHub workflows)"
language = "system"
entry = "command -v actionlint >/dev/null || { echo 'actionlint not installed, skipping'; exit 0; }; actionlint"
shell = "bash"
files = '^\.github/workflows/'
pass_filenames = true
groups = ["check"]
stages = ["pre-commit"]

# ---- commit-msg: Conventional Commits ----
[[repos.hooks]]
id = "conventional-commits"
name = "commit message format"
language = "system"
entry = "python3 scripts/check_commit_msg.py"
pass_filenames = true
stages = ["commit-msg"]
